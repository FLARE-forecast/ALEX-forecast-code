on:
  workflow_dispatch:
  schedule:
  - cron: "0 11 * * *"

name: glm_flare_v3

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rqthomas/flare-rocker:4.4
    steps:
      - name: install deps
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        shell: Rscript {0}
        run: |
          install.packages(c('oce', 'fable'))
          # update tidymodels packages for compatibility with xgboost 3.x in the container
          # (the image's default repo is a frozen 2025-04-10 snapshot, so use the latest one)
          install.packages(c('parsnip', 'tune', 'workflows', 'dials', 'hardhat'),
                           repos = 'https://p3m.dev/cran/__linux__/noble/latest')
          remotes::install_github('cboettig/duckdbfs')
          
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
# Point to the right path, run the right Rscript command
      - name: Run automatic prediction file
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        #  SAWATER_API_USERNAME: ${{ secrets.SAWATER_API_USERNAME }}
        #  SAWATER_API_PASSWORD: ${{ secrets.SAWATER_API_PASSWORD }}
        run: Rscript $GITHUB_WORKSPACE/workflows/glm_flare_v3/combined_workflow.R
